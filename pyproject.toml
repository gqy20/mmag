[project]
name = "mmag"
version = "0.1.0"
description = "Mattermost AI Agent - 通过 WebSocket 实时参与团队对话，支持 Agentic Tool Use"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "websockets>=15.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "trafilatura>=2.1.0",
    "mcp>=1.20.0",
    "claude-agent-sdk>=0.2.101",
    "crawl-mcp>=0.2.0",
    "langgraph>=1.2.0",
]

[project.scripts]
mmag = "mmag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmag"]

# ---- uv 依赖分组 ----

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

# ---- Ruff (lint + format) ----

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = ["E501"]  # line-length 由 formatter 处理

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- pytest ----

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# markers:
#   slow: 调真实 LLM 的端到端测试,日常开发跳过 (-m "not slow")
markers = [
    "slow: 调真实 LLM, 跑一次要 30-60s, 日常开发可跳过",
]
