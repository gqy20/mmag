[project]
name = "mmag"
version = "0.1.0"
description = "Mattermost AI Agent - 通过 WebSocket 实时参与团队对话"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "websockets>=15.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmag"]
