[project]
name = "mmag"
version = "0.1.0"
description = "Mattermost AI Agent - 通过 WebSocket 实时参与团队对话，支持 Agentic Tool Use"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "websockets>=15.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "trafilatura>=2.1.0",
    "mcp>=1.20.0",
    "claude-agent-sdk>=0.2.101",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "jsonschema>=4.23",
    "python-pptx>=1.0.2",
]

[project.scripts]
mmag = "mmag.cli:main"
mmag-eval = "mmag.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmag"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "mmag/agents"
"skills" = "mmag/skills"
"policies" = "mmag/policies"
"model-policies" = "mmag/model-policies"
"execution-profiles" = "mmag/execution-profiles"

# ---- uv 依赖分组 ----

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

# ---- Ruff (lint + format) ----

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = ["E501"]  # line-length 由 formatter 处理

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- pytest ----

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "-m", "not external"]
markers = [
    "slow: 调真实 LLM, 跑一次要 30-60s, 日常开发可跳过",
    "external: 访问真实 Mattermost、LLM 或公网, 默认测试集合排除",
]

# ---- Coverage ----

[tool.coverage.run]
branch = true
source = ["mmag"]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_covered = true

# ---- mypy（Phase 0 宽松基线）----

[tool.mypy]
python_version = "3.12"
files = ["src/mmag"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_configs = true
