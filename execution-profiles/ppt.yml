api_version: mmag.ai/v1
kind: ExecutionProfile

metadata:
  name: ppt
  version: 2.2.0
  description: Demo host-shell build pipeline for editable presentations.

spec:
  runner:
    kind: host
    image_digest: sha256:5843123dcc720fbd8e4d1a0cd69d715ac475b574bc33c6c04afca4ede66093e4

  network:
    mode: host

  environment:
    inherit: []
    set:
      LC_ALL: C.UTF-8
      TZ: UTC

  filesystem:
    read_only: [/usr, /lib, /lib64, /etc/fonts, /etc/ssl]
    writable: [temporary, staging]

  resources:
    timeout_seconds: 180
    cpu_seconds: 120
    memory_bytes: 2147483648
    max_processes: 24
    max_input_bytes: 1048576
    max_output_bytes: 65536
    max_artifact_bytes: 52428800

  commands:
    - id: ppt.source
      permission: artifact:generate
      executable: node
      script_ref: ppt/ppt.cjs
      argv: ["{script}", "source", "--input", "{input}", "--output", "{output}"]
      output:
        filename: slides.md
        kind: presentation_source
        media_type: text/markdown
        schema_version: 1.0.0

    - id: ppt.render
      permission: artifact:generate
      executable: node
      script_ref: ppt/ppt.cjs
      argv: ["{script}", "render", "--input", "{input}", "--output", "{output}"]
      output:
        filename: deck.pptx
        kind: slide_deck
        media_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
        schema_version: 2.0.0

    - id: ppt.preview_svg
      permission: artifact:generate
      executable: node
      script_ref: ppt/ppt.cjs
      argv: ["{script}", "preview", "--input", "{input}", "--output", "{output}"]
      output:
        filename: preview.svg
        kind: presentation_preview_svg
        media_type: image/svg+xml
        schema_version: 1.0.0

    - id: ppt.preview
      permission: artifact:generate
      executable: rsvg-convert
      source_kind: presentation_preview_svg
      argv: ["--format", "png", "--width", "1280", "--height", "720", "--output", "{output}", "{source}"]
      output:
        filename: preview.png
        kind: presentation_preview
        media_type: image/png
        schema_version: 1.0.0
