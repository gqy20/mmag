api_version: mmag.ai/v1
kind: Skill

metadata:
  name: web-research
  version: 1.2.1
  description: 规划、核验并综合网络研究，保留可追溯的来源证据。

spec:
  instruction_ref: SKILL.md
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json

  activation:
    intents: [research, compare, report]
    keywords: [调研, 研究, 竞品, 对比, research, compare]
    priority: 50

  required_capabilities:
    - analyze_link
  optional_capabilities:
    - search_knowledge
    - mcp_crawl_crawl_single
    - mcp_crawl_search_text
    - mcp_crawl_search_news
    - mcp_crawl_search_books

  resources:
    templates: []
    references: []

  disclosure:
    max_resources: 1
    max_resource_bytes: 16384
    max_total_bytes: 32768
    max_estimated_tokens: 8000
