api_version: mmag.ai/v1
kind: Skill

metadata:
  name: slides
  version: 3.1.1
  description: 将受治理的 Markdown 编排为可编辑 PPTX、源文件和图片预览产物。

spec:
  instruction_ref: SKILL.md
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json

  activation:
    intents: [presentation, ppt, slides]
    keywords: [PPT, ppt, 幻灯片, 演示文稿, 路演, slides]
    priority: 70

  required_capabilities:
    - ppt.build
  optional_capabilities:
    - search_knowledge
    - workspace.read
    - workspace.write
    - workspace.execute
    - workspace.commit
    - send_file

  execution_profiles:
    - ppt@2.2.0

  resources:
    templates:
      - deck.md
    references: []

  disclosure:
    max_resources: 1
    max_resource_bytes: 65536
    max_total_bytes: 98304
    max_estimated_tokens: 12000
