api_version: mmag.ai/v1
kind: Skill

metadata:
  name: slides
  version: 2.2.0
  description: Compose governed Markdown into editable PPTX, source, and direct image preview Artifacts.

spec:
  instruction_ref: SKILL.md
  input_schema_ref: schemas/input.schema.json
  output_schema_ref: schemas/output.schema.json

  activation:
    intents: [presentation, ppt, slides]
    keywords: [PPT, ppt, 幻灯片, 演示文稿, 路演, slides]
    priority: 70

  required_capabilities:
    - load_skill_resource
    - ppt.build
  optional_capabilities:
    - search_knowledge
    - ppt.shell
    - send_file

  execution_profiles:
    - ppt@2.1.0

  resources:
    templates:
      - templates/deck.md
      - templates/corp.theme.json
    references:
      - references/story.md
    scripts:
      - scripts/package.json
      - scripts/package-lock.json
      - scripts/ppt-src.cjs
      - scripts/ppt.cjs
      - scripts/shell.py

  disclosure:
    max_resources: 3
    max_resource_bytes: 65536
    max_total_bytes: 98304
    max_estimated_tokens: 12000
