api_version: mmag.ai/v1
kind: Skill

metadata:
  name: link-read
  version: 1.0.0
  description: Extract a source-preserving summary from one governed public URL.

spec:
  instruction_ref: SKILL.md
  input_schema_ref: schemas/input.schema.json
  output_schema_ref: schemas/output.schema.json

  activation:
    intents: [link, url, 链接]
    keywords: [分析链接, 解析链接, 总结链接, analyze-link]
    priority: 100

  required_capabilities:
    - analyze_link
  optional_capabilities: []

  resources:
    templates: []
    references: []
    scripts: []

  disclosure:
    max_resources: 1
    max_resource_bytes: 1024
    max_total_bytes: 1024
    max_estimated_tokens: 256
