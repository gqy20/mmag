api_version: mmag.ai/v1
kind: Skill

metadata:
  name: report
  version: 1.3.1
  description: 生成带有明确证据账本的结构化研究报告。

spec:
  instruction_ref: SKILL.md
  input_schema_ref: input.schema.json
  output_schema_ref: output.schema.json

  activation:
    intents: [report, research, 研报]
    keywords: [研报, 研究报告, 行业报告, 竞品报告, 调研报告]
    priority: 80

  required_capabilities:
    - search_knowledge
  optional_capabilities:
    - search_messages
    - analyze_link
    - mcp_crawl_crawl_single
    - mcp_crawl_crawl_site
    - mcp_crawl_crawl_batch
    - mcp_crawl_search_text
    - mcp_crawl_search_news
    - mcp_crawl_search_books
    - mcp_crawl_search_videos
    - mcp_crawl_search_images

  resources:
    templates:
      - report.md
    references: []

  disclosure:
    max_resources: 1
    max_resource_bytes: 16384
    max_total_bytes: 24576
    max_estimated_tokens: 6000
