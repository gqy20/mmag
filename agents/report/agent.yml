api_version: mmag.ai/v1
kind: ManagedAgent

metadata:
  name: report
  version: 2.2.0
  description: Produce evidence-aware, structured research reports within the active scope.

spec:
  routing:
    default: false
    priority: 80
    keywords: [研报, 研究报告, 行业报告, 竞品报告, 调研报告, 会议纪要, 总结这个线程, research-report, market-report, meeting-summary]
    requires_url: false
    scopes: ["mattermost:*"]

  accepted_intents: [report, research, 研报, meeting]
  prompt:
    system_ref: system.md
    required_variables:
      - current_time
      - actor_name
      - project_context
      - conversation_id

  input_schema_ref: input.schema.json
  result_schema_ref: output.schema.json

  runtime:
    route: default
    max_turns: 12
    timeout_seconds: 300
    retry:
      max_attempts: 2

  capabilities:
    allow: [get_posts, search_knowledge, search_messages, analyze_link, mcp_crawl_*]
    deny: []

  skills:
    allow:
      - report@1.3.0
      - meeting@1.0.0
    deny: []

  context:
    read_scopes: [conversation, project, organization]
    write_scopes: [task]

  policy_ref: report@1.2.0
  model_policy_ref: reasoning-medium@1.0.0

  budget:
    max_model_calls: 12
    max_tool_calls: 30
    max_cost_usd: 1.5

  artifacts:
    produces:
      - kind: research_report
        schema_ref: artifact.schema.json
