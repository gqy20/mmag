api_version: mmag.ai/v1
kind: ManagedAgent

metadata:
  name: mmchat
  version: 2.2.1
  description: 在受限的企业能力范围内参与 Mattermost 对话。

spec:
  routing:
    default: true
    priority: 0
    keywords: []
    requires_url: false
    scopes: ["mattermost:*"]

  accepted_intents: [chat, mention, conversation]
  prompt:
    system_ref: system.md
    required_variables:
      - current_time
      - bot_username
      - bot_user_id
      - current_user_id
      - current_user_username
      - current_user_profile
      - recent_speakers
      - channel_members
  input_schema_ref: input.schema.json
  result_schema_ref: output.schema.json
  runtime:
    route: default
    max_turns: 10
    timeout_seconds: 500
    retry:
      max_attempts: 2
  capabilities:
    allow:
      - get_posts
      - search_messages
      - search_knowledge
      - get_channel_info
      - save_knowledge
      - get_user_profile
      - analyze_link
      - mcp_crawl_search_*
      - ppt.build
    deny: []
  skills:
    allow:
      - web-research@1.2.1
    deny: []
  execution_profiles:
    allow:
      - ppt@2.2.0
    deny: []
  context:
    read_scopes: [conversation, project]
    write_scopes: [conversation]
  policy_ref: mmchat@1.4.0
  model_policy_ref: reasoning-medium@1.0.0
  budget:
    max_model_calls: 10
    max_tool_calls: 30
    max_cost_usd: 5.0
  artifacts:
    produces: []
