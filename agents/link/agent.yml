api_version: mmag.ai/v1
kind: ManagedAgent

metadata:
  name: link
  version: 2.0.1
  description: 分析单个 URL，并返回保留来源信息的结构化产物。

spec:
  routing:
    default: false
    priority: 100
    keywords: [分析链接, 解析链接, 检查链接, 总结链接, analyze-link, link, url, 链接]
    requires_url: true
    scopes: ["mattermost:*"]

  accepted_intents: [link, url, 链接]
  input_schema_ref: input.schema.json
  result_schema_ref: output.schema.json

  runtime:
    mode: direct
    capability: analyze_link
    source_argument: url
    route: default
    max_turns: 4
    timeout_seconds: 120
    retry:
      max_attempts: 2

  capabilities:
    allow: [analyze_link]
    deny: []

  skills:
    allow: []
    deny: []

  context:
    read_scopes: [conversation, project]
    write_scopes: [task]

  policy_ref: link-readonly@1.0.0
  model_policy_ref: reasoning-low@1.0.0

  budget:
    max_model_calls: 4
    max_tool_calls: 2
    max_cost_usd: 0.1

  artifacts:
    produces:
      - kind: link_analysis
        schema_ref: artifact.schema.json
