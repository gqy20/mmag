api_version: mmag.ai/v1
kind: ManagedAgent

metadata:
  name: link
  version: 1.2.0
  description: Analyze one URL and return a source-preserving structured artifact.

spec:
  execution:
    kind: capability
    provider: single-v1
    capability: analyze_link
    source_argument: url

  routing:
    default: false
    priority: 100
    keywords: [分析链接, 解析链接, 检查链接, 总结链接, analyze-link, link, url, 链接]
    requires_url: true
    scopes: ["mattermost:*"]

  accepted_intents: [link, url, 链接]
  prompt:
    system_ref: prompts/system.md
    task_ref: prompts/task.md
    output_repair_ref: prompts/output_repair.md
    required_variables:
      - current_time
      - actor_name
      - project_context
      - task_goal
      - invalid_output
      - validation_error

  input_schema_ref: schemas/input.schema.json
  result_schema_ref: schemas/output.schema.json

  runtime:
    route: default
    max_turns: 4
    timeout_seconds: 120
    retry:
      max_attempts: 2

  capabilities:
    allow: [analyze_link]
    deny: []

  skills:
    allow:
      - link-read@1.0.0
    deny: []

  context:
    read_scopes: [conversation, project]
    write_scopes: [task]

  policy_ref: link-readonly@1.0.0
  model_policy_ref: reasoning-low@1.0.0

  budget:
    max_model_calls: 4
    max_tool_calls: 2
    max_cost_usd: 0.1

  artifacts:
    produces:
      - kind: link_analysis
        schema_ref: schemas/artifact.schema.json
