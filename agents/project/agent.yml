api_version: mmag.ai/v1
kind: ManagedAgent

metadata:
  name: project
  version: 1.0.0
  description: Turn scoped team context into actionable project plans and status briefs.

spec:
  execution:
    kind: langgraph
    provider: json-v1

  routing:
    default: false
    priority: 60
    keywords: [项目助理, 项目计划, 任务拆解, 进度跟踪, 里程碑, project-plan, milestone]
    requires_url: false
    scopes: ["mattermost:*"]

  accepted_intents: [project, plan, status]
  prompt:
    system_ref: prompts/system.md
    task_ref: prompts/task.md
    output_repair_ref: prompts/output_repair.md
    required_variables:
      - current_time
      - actor_name
      - project_context
      - conversation_id
      - task_goal
      - parameters_json
      - context_refs_json
      - artifact_refs_json
      - invalid_output
      - validation_error

  input_schema_ref: schemas/input.schema.json
  result_schema_ref: schemas/output.schema.json

  runtime:
    route: default
    max_turns: 10
    timeout_seconds: 240
    retry:
      max_attempts: 2

  capabilities:
    allow:
      - load_skill_resource
      - get_channel_info
      - get_posts
      - search_messages
      - search_knowledge
      - save_knowledge
    deny: []

  skills:
    allow:
      - project@1.0.0
    deny: []

  context:
    read_scopes: [conversation, project, organization]
    write_scopes: [task, project]

  policy_ref: project@1.0.0
  model_policy_ref: reasoning-medium@1.0.0

  budget:
    max_model_calls: 10
    max_tool_calls: 25
    max_cost_usd: 1.0

  artifacts:
    produces:
      - kind: project_brief
        schema_ref: schemas/artifact.schema.json
