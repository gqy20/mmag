id: project
version: 1.2.0
default_effect: deny

rules:
  - id: read-skill-resource
    effect: allow
    actions: [load_skill_resource]
    permissions: [skill:resource:read]
    reason: Project may load only resources declared by its active Skill.

  - id: manage-tasks
    effect: allow
    actions: [create_task, list_tasks, update_task, get_task_overview]
    permissions: [task:write, task:read]
    scopes: ["mattermost:*"]
    reason: Project agent may create and track organizational items.

  - id: manage-goals
    effect: allow
    actions: [create_goal, list_goals, update_goal, get_goal_overview]
    permissions: [goal:write, goal:read]
    scopes: ["mattermost:*"]
    reason: Project may manage the small internal Goal object in the current trusted scope.

  - id: read-lark-work
    effect: allow
    actions: [mcp_lark_fetch_document, mcp_lark_list_my_tasks]
    permissions: [mcp:lark:fetch_document:invoke, mcp:lark:list_my_tasks:invoke]
    scopes: ["mattermost:*"]
    reason: Project may read Lark sources only through the authenticated narrow MCP adapter.

  - id: write-lark-work
    effect: require_approval
    actions: [mcp_lark_create_task, mcp_lark_set_task_reminder]
    permissions: [mcp:lark:create_task:invoke, mcp:lark:set_task_reminder:invoke]
    scopes: ["mattermost:*"]
    reason: Creating or reminding a Lark task is an external side effect.

  - id: read-current-channel
    effect: allow
    actions: [get_channel_info, get_posts, search_messages, search_knowledge]
    permissions:
      - mattermost:channel:read
      - mattermost:post:read
      - memory:messages:read
      - memory:knowledge:read
    resource_arguments:
      channel_id: conversation_id
    reason: Project context reads are restricted to the originating channel.

  - id: approve-project-memory
    effect: require_approval
    actions: [save_knowledge]
    permissions: [memory:knowledge:write]
    resource_arguments:
      channel_id: conversation_id
    reason: Persisting a project decision changes shared enterprise memory.
