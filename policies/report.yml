id: report
version: 1.2.0
default_effect: deny

rules:
  - id: read-current-channel-posts
    effect: allow
    actions: [get_posts]
    permissions: [mattermost:post:read]
    resource_arguments:
      channel_id: conversation_id
    reason: Meeting summaries may read only the originating Mattermost conversation.

  - id: read-current-knowledge
    effect: allow
    actions: [search_knowledge]
    permissions: [memory:knowledge:read]
    resource_arguments:
      channel_id: conversation_id
    reason: Report research is restricted to the originating channel knowledge scope.

  - id: search-current-messages
    effect: allow
    actions: [search_messages]
    permissions: [memory:messages:read]
    resource_arguments:
      channel_id: conversation_id
    reason: Report research may search only the originating channel history.

  - id: analyze-public-link
    effect: allow
    actions: [analyze_link]
    permissions: [web:read]
    reason: Public link analysis remains behind the shared SSRF controls.

  - id: approve-crawl-mcp
    effect: require_approval
    actions: [mcp_crawl_*]
    permissions: [mcp:crawl:*:invoke]
    reason: External MCP resources remain approval-gated until resource semantics are trusted.
