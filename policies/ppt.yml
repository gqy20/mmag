id: ppt
version: 2.3.0
default_effect: deny

rules:
  - id: read-skill-resource
    effect: allow
    actions: [load_skill_resource]
    permissions: [skill:resource:read]
    reason: PPT may load only resources declared by its active Skill.

  - id: read-current-knowledge
    effect: allow
    actions: [search_knowledge]
    permissions: [memory:knowledge:read]
    resource_arguments:
      channel_id: conversation_id
    reason: Presentation context is restricted to the originating channel knowledge scope.

  - id: generate-presentation-artifact
    effect: allow
    actions: [ppt.build]
    permissions: [artifact:generate]
    reason: Presentation generation is constrained to registered commands and Artifact staging.

  - id: read-run-workspace
    effect: allow
    actions: [workspace.read]
    permissions: [workspace:file:read]
    reason: Files are restricted to the stable workspace of the current Run.

  - id: write-run-workspace
    effect: allow
    actions: [workspace.write]
    permissions: [workspace:file:write]
    reason: Writes are restricted to the stable workspace of the current Run.

  - id: approve-unsafe-demo-command
    effect: require_approval
    actions: [workspace.execute]
    permissions: [workspace:process:execute]
    reason: Every unrestricted local Demo command requires explicit approval.

  - id: commit-declared-workspace-output
    effect: allow
    actions: [workspace.commit]
    permissions: [artifact:generate]
    reason: Only fixed outputs declared by the active Execution Profile may become Artifacts.

  - id: approve-deck-delivery
    effect: require_approval
    actions: [send_file]
    permissions: [mattermost:file:write]
    reason: Every generated PPTX enters explicit approval before Mattermost attachment delivery.
