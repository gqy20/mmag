id: mmchat
version: 1.4.1
default_effect: deny

rules:
  - id: read-current-channel
    effect: allow
    actions: [get_channel_info, get_posts, search_messages, search_knowledge]
    permissions:
      - mattermost:channel:read
      - mattermost:post:read
      - memory:messages:read
      - memory:knowledge:read
    resource_arguments:
      channel_id: conversation_id
    reason: MMChat may only read the originating Mattermost channel.

  - id: read-own-profile
    effect: allow
    actions: [get_user_profile]
    permissions: [memory:user_profile:read]
    scopes: ["mattermost:*:*:usr:*"]
    resource_arguments:
      user_id: actor_id
    reason: Private profile access is restricted to the requesting actor in personal mode.

  - id: analyze-public-link
    effect: allow
    actions: [analyze_link]
    permissions: [web:read]
    reason: Public link analysis is allowed behind URL network controls.

  - id: write-current-channel-knowledge
    effect: allow
    actions: [save_knowledge]
    permissions: [memory:knowledge:write]
    resource_arguments:
      channel_id: conversation_id
    reason: Knowledge writes are restricted to the originating channel.

  - id: build-presentation
    effect: allow
    actions: [ppt.build]
    permissions: [artifact:generate]
    reason: PPT generation is allowed when the slides Skill is active.

  - id: delegate-subagents
    effect: allow
    actions: [delegate_ppt, delegate_report, delegate_project, delegate_link]
    permissions: [delegate:ppt, delegate:report, delegate:project, delegate:link]
    reason: MMChat may dispatch tasks to registered sub-agents.

  - id: approve-allowlisted-mcp
    effect: require_approval
    actions: [mcp_crawl_search_*]
    permissions: [mcp:crawl:*:invoke]
    reason: MCP resource semantics are server-defined, so every invocation requires approval.
